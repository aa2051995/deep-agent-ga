# Jenkins CI/CD agent identity for Deep Agent GA.
# -----------------------------------------------------------------------------
# One ServiceAccount, two grants:
#   1. AWS  (IRSA)  -> push images to ECR (kaniko).           [annotation below]
#   2. K8s  (RBAC)  -> deploy the Helm release into deep-agent-ga. [Role/RoleBinding]
#
# Create the IAM role and bind it to this SA with eksctl (creates the SA too,
# so you normally apply ONLY the Role/RoleBinding from this file):
#
#   eksctl create iamserviceaccount \
#     --cluster deep-agent-ga --region us-east-1 \
#     --namespace jenkins --name jenkins-agent \
#     --role-name deep-agent-ga-jenkins-agent \
#     --attach-policy-arn arn:aws:iam::553138586148:policy/DeepAgentGaJenkinsEcrPush \
#     --approve
#
# Then:  kubectl apply -f deploy/cicd/jenkins-agent-serviceaccount.yaml
# (The SA below is a no-op re-declaration if eksctl already made it; it documents
#  the required IRSA annotation. Replace <ACCOUNT_ID> if you skip eksctl.)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: jenkins
  annotations:
    # IRSA role granting ECR push (see iam-policy-jenkins-ecr.json).
    eks.amazonaws.com/role-arn: arn:aws:iam::553138586148:role/deep-agent-ga-jenkins-agent
---
# RBAC: let the agent SA manage exactly what the chart deploys in deep-agent-ga.
# helm also stores release state as Secrets in this namespace (covered below).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deep-agent-ga-deployer
  namespace: deep-agent-ga
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deep-agent-ga-deployer
  namespace: deep-agent-ga
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deep-agent-ga-deployer
subjects:
  - kind: ServiceAccount
    name: jenkins-agent
    namespace: jenkins   # the namespace Jenkins runs its agent pods in
