{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deep-research.secretName" . }}
  labels:
    {{- include "deep-research.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.tavilyApiKey }}
  TAVILY_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleApiKey }}
  GOOGLE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.langsmithApiKey }}
  LANGSMITH_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsSessionToken }}
  AWS_SESSION_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
