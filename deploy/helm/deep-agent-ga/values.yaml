# Default values for the deep-agent-ga chart.
# Every service (postgres, rabbitmq, apiserver, worker, ui) is configured here.
# For an AWS/EKS-tuned starting point see values-aws.yaml.

# -----------------------------------------------------------------------------
# Global
# -----------------------------------------------------------------------------
global:
  # Registry prefix for the APP images only (apiserver / worker / ui) — e.g. your
  # ECR. It is NOT applied to postgres/rabbitmq (those pull from Docker Hub; set
  # their own `image.registry` if you mirror them).
  imageRegistry: ""          # e.g. 553138586148.dkr.ecr.us-east-1.amazonaws.com
  imagePullSecrets: []       # e.g. [{ name: ecr-creds }]  (not needed when the node role has ECR read)

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Application-wide settings shared by apiserver + worker (agent + backend wiring)
# -----------------------------------------------------------------------------
app:
  # Durable store and event/broker transports. These map 1:1 onto the env vars
  # the code reads (see stream-backend/app/main.py, event_bus.py, worker/).
  store: postgres            # STREAM_BACKEND_STORE
  eventBroker: rabbitmq      # STREAM_BACKEND_EVENT_BROKER
  runnerBackend: celery      # STREAM_BACKEND_RUNNER_BACKEND (celery => runs execute on the worker)
  celeryQueue: deep-agent-ga-runs   # STREAM_BACKEND_CELERY_QUEUE

  # Research agent model selection.
  research:
    provider: bedrock        # RESEARCH_AGENT_PROVIDER (bedrock | google | anthropic | openai)
    model: moonshotai.kimi-k2.5   # RESEARCH_AGENT_MODEL

  aws:
    region: us-east-1      # AWS_REGION (Bedrock)
    # Bedrock auth. Prefer IRSA (serviceAccount.annotations) over static keys.
    # When useProfile is false the AWS_BEDROCK_PROFILE env is omitted so the
    # default credential chain (IRSA / instance role / static keys) is used.
    useProfile: false
    profile: ""              # AWS_BEDROCK_PROFILE (only if useProfile: true)

  logLevel: INFO             # STREAM_BACKEND_LOG_LEVEL

  # Assistant store. Each assistant carries its own model/provider (used by runs
  # in preference to app.research.* above, which is only a fallback for unknown
  # assistants). Assistants are stored as files; for the worker to honor
  # UI-created/edited assistants — and for edits to survive restarts — the
  # apiserver and worker must SHARE this directory over an RWX volume (EFS on AWS).
  # When disabled, only the read-only assistants baked into the image are used
  # (fine if you manage assistants via the repo and rebuild the image).
  assistantsStore:
    # "filesystem" (default) => assistants are folders on disk (baked-in, or on
    # the shared RWX volume below). "postgres" => configs AND skill/memory file
    # bodies live in Postgres (apiserver+worker already share it), so NO shared
    # volume is needed — set persistence.enabled: false with this backend.
    backend: filesystem           # filesystem | postgres  (STREAM_BACKEND_ASSISTANT_STORE)
    mountPath: /data/assistants   # STREAM_BACKEND_ASSISTANTS_DIR (filesystem backend, persistence on)
    persistence:
      enabled: false
      existingClaim: ""           # bind a pre-provisioned RWX/EFS PVC; else the chart creates one
      storageClassName: efs-sc    # an RWX StorageClass (AWS EFS CSI)
      accessModes: ["ReadWriteMany"]
      size: 1Gi

  # Block apiserver/worker startup until their in-cluster dependencies (postgres,
  # rabbitmq AMQP + stream ports) accept TCP connections. This makes the app
  # tolerant of a slow/delayed dependency at boot (no DNS "Name or service not
  # known" crash, no failed one-shot seeding). Runtime reconnection after a
  # dependency restart is handled by the connection pools / broker reconnect
  # logic, independent of this.
  waitForDependencies:
    enabled: true
    timeoutSeconds: 300        # give up (and let the pod restart) after this long

  # Extra free-form env applied to apiserver + worker (non-secret).
  extraEnv: {}
    # SOME_FLAG: "true"

# -----------------------------------------------------------------------------
# Secrets. Provide real values here or via `--set-string secrets.xxx=...`, or
# set secrets.create=false and reference a pre-existing Secret with the same keys.
# -----------------------------------------------------------------------------
secrets:
  create: true
  existingSecret: ""         # if set, chart-managed Secret is not created

  # Model / tool API keys (only those relevant to app.research.provider are required).
  tavilyApiKey: ""           # TAVILY_API_KEY  (web search — required)
  googleApiKey: ""           # GOOGLE_API_KEY
  anthropicApiKey: ""        # ANTHROPIC_API_KEY
  openaiApiKey: ""           # OPENAI_API_KEY
  langsmithApiKey: ""        # LANGSMITH_API_KEY

  # AWS static credentials (leave blank when using IRSA / instance role).
  awsAccessKeyId: ""         # AWS_ACCESS_KEY_ID
  awsSecretAccessKey: ""     # AWS_SECRET_ACCESS_KEY
  awsSessionToken: ""        # AWS_SESSION_TOKEN (optional)

# -----------------------------------------------------------------------------
# ServiceAccount (attach IRSA role for Bedrock/ECR via annotations)
# -----------------------------------------------------------------------------
serviceAccount:
  create: false
  name: "deep-agent-ga-bedrock-account"
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/deep-agent-ga-bedrock

# -----------------------------------------------------------------------------
# PostgreSQL (StatefulSet + headless Service + PVC on EBS)
# -----------------------------------------------------------------------------
postgres:
  enabled: true
  # Use an external managed database (e.g. RDS) instead of the in-cluster one.
  external:
    enabled: false
    # Full DSN; when set, apiserver/worker use it verbatim and no StatefulSet is deployed.
    connectionUrl: ""        # postgres://user:pass@host:5432/db?sslmode=require

  image:
    registry: ""             # blank => Docker Hub. Set to mirror (e.g. an ECR pull-through cache).
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    username: postgres
    password: postgres       # override in production (or use secrets/external RDS)
    database: deepresearch

  service:
    port: 5432

  persistence:
    enabled: true
    storageClassName: ebs-gp3
    accessModes: ["ReadWriteOnce"]
    size: 10Gi

  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# -----------------------------------------------------------------------------
# RabbitMQ (StatefulSet: AMQP 5672 for Celery + Streams 5552 for events)
# -----------------------------------------------------------------------------
rabbitmq:
  enabled: true
  external:
    enabled: false
    amqpUrl: ""              # amqp://user:pass@host:5672//
    streamUrl: ""            # rabbitmq-stream://user:pass@host:5552/

  image:
    registry: ""             # blank => Docker Hub. Set to mirror (e.g. an ECR pull-through cache).
    repository: rabbitmq
    tag: "3.13-management"
    pullPolicy: IfNotPresent

  auth:
    username: guest
    password: guest          # override in production

  ports:
    amqp: 5672
    stream: 5552
    management: 15672

  persistence:
    enabled: true
    storageClassName: ebs-gp3
    accessModes: ["ReadWriteOnce"]
    size: 8Gi

  # Streams retain events for this many hours (matches app default).
  streamMaxAgeHours: 12

  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# -----------------------------------------------------------------------------
# apiserver (FastAPI / uvicorn) — stateless, autoscaled
# -----------------------------------------------------------------------------
apiserver:
  image:
    repository: deep-agent-ga-backend
    tag: latest
    pullPolicy: Always

  replicas: 1
  containerPort: 8123

  service:
    type: ClusterIP
    port: 8123

  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# worker (Celery) — stateless, autoscaled. Shares the apiserver image.
# -----------------------------------------------------------------------------
worker:
  image:
    repository: deep-agent-ga-backend
    tag: latest
    pullPolicy: Always

  replicas: 1
  # Celery pool + concurrency. Threads pool matches the project's guidance.
  pool: prefork
  concurrency: 4

  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# ui (nginx serving the SPA + reverse-proxying /api to the apiserver)
# -----------------------------------------------------------------------------
ui:
  image:
    repository: deep-agent-ga-ui
    tag: latest
    pullPolicy: Always

  replicas: 1
  containerPort: 8080

  # Browser-facing API base. "/api" keeps the browser same-origin (nginx proxies
  # it to the apiserver). Set to an absolute URL to call the API cross-origin.
  apiUrl: "/api"

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: "50m"
      memory: 64Mi
    limits:
      cpu: "500m"
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# Ingress (defaults to the AWS Load Balancer Controller / ALB)
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: alb
  # Sensible ALB defaults; internet-facing, IP target type, health check on the UI.
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
  host: ""                   # e.g. research.example.com ("" => path-based on the LB DNS)
  tls:
    enabled: false
    secretName: ""
