{{- $worker := include "deep-agent-ga.worker.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $worker }}
  labels:
    {{- include "deep-agent-ga.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "deep-agent-ga.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "deep-agent-ga.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "deep-agent-ga.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $hasInclusterDeps := or (and .Values.postgres.enabled (not .Values.postgres.external.enabled)) (and .Values.rabbitmq.enabled (not .Values.rabbitmq.external.enabled)) }}
      {{- $wait := and .Values.app.waitForDependencies.enabled $hasInclusterDeps }}
      {{- if or $wait .Values.app.assistantsStore.persistence.enabled }}
      initContainers:
        {{- if $wait }}
        {{- include "deep-agent-ga.waitForDepsInit" (dict "root" $ "image" .Values.worker.image) | nindent 8 }}
        {{- end }}
        {{- include "deep-agent-ga.assistantsInitContainer" (dict "root" $ "image" .Values.worker.image) | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "deep-agent-ga.appImage" (dict "root" $ "image" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - celery
            - -A
            - worker.celery_app.celery_app
            - worker
            - --loglevel={{ .Values.app.logLevel }}
            - -P
            - {{ .Values.worker.pool }}
            - --concurrency={{ .Values.worker.concurrency }}
            - --queues={{ .Values.app.celeryQueue }}
          env:
            {{- include "deep-agent-ga.backendEnv" . | nindent 12 }}
          # Liveness: the worker responds to a Celery control ping.
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A worker.celery_app.celery_app inspect ping -d celery@$HOSTNAME --timeout 10"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.app.assistantsStore.persistence.enabled }}
          volumeMounts:
            {{- include "deep-agent-ga.assistantsVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.app.assistantsStore.persistence.enabled }}
      volumes:
        {{- include "deep-agent-ga.assistantsVolume" . | nindent 8 }}
      {{- end }}
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $worker }}
  labels:
    {{- include "deep-agent-ga.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $worker }}
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    {{- with .Values.worker.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
